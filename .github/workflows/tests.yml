name: Formula Audit

on:
  push:
    paths:
      - "Formula/**"
  pull_request:
    paths:
      - "Formula/**"

jobs:
  audit:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@f78b97900ce6c3c9c4e99de00a999e5541eeaabb

      - name: Audit formula
        run: brew audit --strict --online omnideck

      - name: Install formula
        run: brew install --formula omnideck

      - name: Run formula tests
        run: brew test omnideck
